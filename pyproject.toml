[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sven"
version = "0.1.0"
authors = [{name = "Sam Bright-Thonney", email = "sambt@mit.edu"}]
description = "SVD-based optimization for neural networks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch==2.8.0",
    "numpy",
    "scipy",
    "pytest"
]

[project.optional-dependencies]
jax = [
    "jax",
    "flax",
    "optax",
]
# Benchmark/eval harnesses only (comparisons/); not needed to use the optimizer
evals = [
    "matplotlib>=3.5",
    "pyarrow>=14",
]

[tool.setuptools.packages.find]
include = ["sven*"]
