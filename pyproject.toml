[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sven"
version = "0.1.0"
authors = [{name = "Anonymous", email = "anonymous@anon.org"}]
description = "SVD-based optimization for neural networks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch==2.8.0",
    "numpy",
    "scipy",
    "pytest"
]

[project.optional-dependencies]
jax = [
    "jax",
    "flax",
    "optax",
]
# Benchmark/eval harnesses only (comparisons/); not needed to use the optimizer
evals = [
    "matplotlib>=3.5",
    "pyarrow>=14",
]

[tool.setuptools.packages.find]
include = ["sven*"]

[tool.pytest.ini_options]
# `pytest` from the repo root collects the CPU test suite; the JAX files skip
# themselves when the optional `jax` extra is not installed.
testpaths = ["tests"]
addopts = "-ra"
